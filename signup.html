<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join — Akshay AI Tools</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            overflow-x: hidden;
            position: relative;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            z-index: 10;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-card {
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 48px;
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(24px);
        }

        .auth-logo {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 800;
            text-align: center;
            display: block;
            margin-bottom: 32px;
            text-decoration: none;
            color: var(--text-head);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-header h1 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
            color: var(--text-head);
        }

        .auth-header p {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 24px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-body);
            opacity: 0.8;
        }

        .form-input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text-head);
            font-family: var(--font-body);
            font-size: 1rem;
            transition: var(--transition);
            outline: none;
            box-sizing: border-box;
        }

        .form-input:focus {
            border-color: var(--accent-primary);
            background: rgba(123,47,255,0.05);
            box-shadow: 0 0 0 4px rgba(123,47,255,0.1);
        }

        .btn-auth {
            width: 100%;
            padding: 16px;
            background: var(--accent-primary);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 12px;
        }

        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(123,47,255,0.3);
            filter: brightness(1.1);
        }

        .auth-footer {
            margin-top: 32px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .error-box {
            background: rgba(255,68,68,0.1);
            color: #ff4444;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 24px;
            display: none;
            text-align: center;
            border: 1px solid rgba(255,68,68,0.2);
        }

        .orb {
            position: absolute;
            background: var(--accent-dim);
            filter: blur(120px);
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
        }
        .orb-1 { width: 400px; height: 400px; top: -100px; left: -100px; }
        .orb-2 { width: 300px; height: 300px; bottom: -50px; right: -50px; opacity: 0.5; }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="auth-logo">Akshay <span class="gradient-text">AI</span></a>
            <div class="auth-header">
                <h1>Join the Future</h1>
                <p>Create your free AI Tools account</p>
            </div>

            <div id="auth-error" class="error-box"></div>

            <form id="signupForm">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="name" class="form-input" placeholder="Akshay Bhor" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="name@domain.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Create a strong password" required>
                </div>
                <button type="submit" class="btn-auth" id="submitBtn">Create Account →</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign in here</a>
            </div>
        </div>
    </div>

    <script src="insforge.js"></script>
    <script src="script.js"></script>
    <script>
        const signupForm = document.getElementById('signupForm');
        const errorBox = document.getElementById('auth-error');
        const submitBtn = document.getElementById('submitBtn');

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Creating account...';
            errorBox.style.display = 'none';

            try {
                const result = await INSFORGE.auth.signUp({ email, password, name });
                
                if (result.user) {
                    if (result.requireVerification) {
                        alert('Verification code sent to your email!');
                        window.location.href = 'login.html';
                    } else {
                        AUTH.login({ name: result.user?.name || name, email: result.user?.email || email, photo: '' });
                        showToast('Account created! Welcome ' + name + ' 🚀', 'success', '✓');
                        setTimeout(() => { window.location.href = 'dashboard.html'; }, 500);
                    }
                }
            } catch (err) {
                // Fallback for local creation
                const users = JSON.parse(localStorage.getItem('aat_users') || '[]');
                if (!users.find(u => u.email === email)) {
                    users.push({ name, email, password, photo: '' });
                    localStorage.setItem('aat_users', JSON.stringify(users));
                    AUTH.login({ name, email, photo: '' });
                    showToast('Account created! Welcome ' + name + ' 🚀', 'success', '✓');
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 500);
                    return;
                }
                errorBox.textContent = err.message || 'Signup failed. Please try again.';
                errorBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Create Account →';
            }
        });
    </script>
</body>
</html>
